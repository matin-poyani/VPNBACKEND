name: Auto Update Subscription

on:
  schedule:
   - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: vpn-subscription-update
  cancel-in-progress: true

jobs:
  update-subscription:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: 3. Install Xray
        run: |
          mkdir -p /tmp/xray
          curl -L https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o /tmp/xray/Xray-linux-64.zip
          unzip -o /tmp/xray/Xray-linux-64.zip -d /tmp/xray
          sudo install -m 755 /tmp/xray/xray /usr/local/bin/xray
          xray version

      - name: 4. Run subscription updater
        env:
          XRAY_BINARY_PATH: /usr/local/bin/xray
        run: dotnet run

      - name: 5. Show summary output
        run: |
          echo "=== valid-servers.txt preview ==="
          head -n 20 valid-servers.txt || true

      - name: 6. Commit and push only if output changed
        run: |
          git config --global user.name "matin-poyani"
          git config --global user.email "matin.poyani@yahoo.com"
          git add my-sub.txt valid-servers.txt
          if git diff --cached --quiet; then
            echo "No changes detected; skipping commit."
          else
            git commit -m "Auto update: $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
